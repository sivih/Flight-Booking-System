<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Bookings Information</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-bookings.css}" />
</head>
<body>

    <div class="table-wrapper">
        <div class="page-header">
            <h1>User Bookings Information</h1>
            <div class="header-actions">
                <a href="/admin/dashboard" class="btn btn-secondary-nav">← Back to Dashboard</a>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Booking ID</th>
                        <th>User ID</th>
                        <th>Username</th>
                        <th>Source</th>
                        <th>Destination</th>
                        <th>Departure</th>
                        <th>Arrival</th>
                        <th>Class</th>
                        <th>Tickets</th>
                        <th>Total Price</th>
                        <th>Payment</th>
                        <th>Confirmation</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="booking : ${bookings}">
                        <td class="fw-medium text-muted" th:text="${booking.bookingId}">4</td>
                        <td class="fw-medium" th:text="${booking.userId}">17</td>
                        <td class="fw-bold" th:text="${booking.username}">sivjena.h</td>
                        <td th:text="${booking.source}">Berlin</td>
                        <td th:text="${booking.destination}">Rome</td>
                        <td class="date-col" th:text="${booking.departureDate}">2026-06-02</td>
                        <td class="date-col" th:text="${booking.arrivalDate}">2026-06-02</td>
                        <td>
                            <span th:class="${booking.flightClass == 'First Class'} ? 'badge badge-firstclass' : 
                                           (${booking.flightClass == 'Business'} ? 'badge badge-business' : 'badge badge-economy')"
                                  th:text="${booking.flightClass}">Economy</span>
                        </td>
                        <td class="text-center" th:text="${booking.tickets}">2</td>
                        <td class="fw-semibold color-primary" th:text="'€' + ${booking.totalPrice}">600.0</td>
                        <td th:text="${booking.paymentMethod}">Credit Card</td>
                        <td>
                            <span th:class="${booking.confirmation == 'Confirmed'} ? 'badge badge-success' : 'badge badge-pending'" 
                                  th:text="${booking.confirmation != null && booking.confirmation != ''} ? ${booking.confirmation} : 'Pending'">
                                Pending
                            </span>
                        </td>
                        <td>
                            <div class="action-group">
                                <a th:href="@{'/admin/bookings/edit/' + ${booking.bookingId}}" class="btn btn-update">Update</a>
                                <a href="#" 
                                   th:onclick="'if(confirm(\'Are you sure you want to delete booking ID ' + ${booking.bookingId} + '?\')) window.location.href=\'/admin/bookings/delete/' + ${booking.bookingId} + '\'; return false;'" 
                                   class="btn btn-delete">
                                   Delete
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
