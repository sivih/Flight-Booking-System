<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="overlay"></div>
    
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>Admin Dashboard</h1>
        </div>
        
        <div class="button-grid">
            <button class="dashboard-button" onclick="window.location.href='/admin/flights'">
                <span>✈️ View Flights</span>
            </button>
            
            <button class="dashboard-button" onclick="window.location.href='/admin/bookings'">
                <span>📝 View Bookings</span>
            </button>
            
            <button class="dashboard-button long-button" onclick="window.location.href='/admin/users'">
                <span>👥 View User Registrations</span>
            </button>
        </div>
        
        <div class="dashboard-footer">
            <button class="back-button" onclick="window.location.href='/'">
                ← Back to Home
            </button>
        </div>
    </div>
</body>
</html>
