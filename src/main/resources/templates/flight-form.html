<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${flight.id == 0} ? 'Add Flight' : 'Edit Flight'">Flight Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/flight-form.css}" />
</head>
<body>

    <div class="form-container">
        <div class="form-card">
            <div class="card-header">
                <h2 th:text="${flight.id == 0} ? 'Add New Flight' : 'Edit Flight'">Flight Form</h2>
                <p>Configure system parameters and route definitions for this entry.</p>
            </div>
            
            <form th:action="@{/admin/flights/save}" th:object="${flight}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="form-grid">
                    <div class="form-group">
                        <label for="flightName">Flight Name</label>
                        <input type="text" id="flightName" th:field="*{flightName}" placeholder="Enter flight name" required />
                    </div>

                    <div class="form-group">
                        <label for="source">Source</label>
                        <input type="text" id="source" th:field="*{source}" placeholder="Enter source" required />
                    </div>

                    <div class="form-group">
                        <label for="destination">Destination</label>
                        <input type="text" id="destination" th:field="*{destination}" placeholder="Enter destination" required />
                    </div>

                    <div class="form-group">
                        <label for="time">Time</label>
                        <input type="time" id="time" th:field="*{time}" required />
                    </div>

                    <div class="form-group">
                        <label for="dateDeparture">Departure Date</label>
                        <input type="date" id="dateDeparture" th:field="*{dateDeparture}" required />
                    </div>

                    <div class="form-group">
                        <label for="dateArrival">Arrival Date</label>
                        <input type="date" id="dateArrival" th:field="*{dateArrival}" required />
                    </div>

                    <div class="form-group">
                        <label for="passengerCount">Passenger Count</label>
                        <input type="number" id="passengerCount" th:field="*{passengerCount}" min="1" required />
                    </div>

                    <div class="form-group">
                        <label for="price">Price (€)</label>
                        <input type="number" id="price" th:field="*{price}" step="0.01" min="0" required />
                    </div>
                </div>

                <div class="form-actions">
                    <a href="/admin/flights" class="btn btn-cancel">Cancel</a>
                    <button type="submit" class="btn btn-submit" 
                            th:text="${flight.id == 0} ? 'Add Flight' : 'Update Flight'">Submit</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
