<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flights Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-flights.css}" />
</head>
<body>

    <div class="table-wrapper">
        <div class="page-header">
            <h1>Flights Management</h1>
            <div class="header-actions">
                <button class="btn btn-secondary-nav" onclick="window.location.href='/admin/dashboard'">
                    ← Back to Dashboard
                </button>
                <a th:href="@{/admin/flights/add}" class="btn btn-add">+ Add New Flight</a>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Flight Name</th>
                        <th>Source</th>
                        <th>Destination</th>
                        <th>Departure</th>
                        <th>Arrival</th>
                        <th>Time</th>
                        <th>Passengers</th>
                        <th>Price</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="flight : ${flights}">
                        <td class="fw-medium" th:text="${flight.id}">1</td>
                        <td class="fw-bold" th:text="${flight.flightName}">A12349</td>
                        <td th:text="${flight.source}">Tirana</td>
                        <td th:text="${flight.destination}">Barcelona</td>
                        <td th:text="${flight.dateDeparture}">2026-05-30</td>
                        <td th:text="${flight.dateArrival}">2026-05-30</td>
                        <td class="text-muted" th:text="${flight.time}">12:00</td>
                        <td th:text="${flight.passengerCount}">98</td>
                        <td class="fw-semibold color-primary" th:text="'€' + ${flight.price}">234.0</td>
                        <td>
                            <div class="action-group">
                                <a th:href="@{'/admin/flights/edit/' + ${flight.id}}" class="btn btn-update">Update</a>
        
                                <a href="#" 
                                   th:onclick="'if(confirm(\'Are you sure you want to delete flight ID ' + ${flight.id} + '?\')) window.location.href=\'/admin/flights/delete/' + ${flight.id} + '\'; return false;'" 
                                   class="btn btn-delete">
                                   Delete
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
